server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline stiller mevcut sayfa işaretlemesi için geçici olarak desteklenir;
    # betikler yalnızca aynı kaynaklı harici dosyalardan çalıştırılır.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https://qfmoughtxjgyusocywax.supabase.co; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    # Traefik normalde /api/v1 isteklerini doğrudan backend'e yönlendirir.
    # Bu fallback, frontend image'ının izole smoke/kabul ortamında da aynı-origin
    # public akışı gerçek backend üzerinden çalıştırabilmesini sağlar.
    location ^~ /api/v1/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https://qfmoughtxjgyusocywax.supabase.co; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com" always;
        try_files $uri =404;
    }

    location ~* \.(?:svg|webp|png|jpe?g|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https://qfmoughtxjgyusocywax.supabase.co; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https://qfmoughtxjgyusocywax.supabase.co; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}
