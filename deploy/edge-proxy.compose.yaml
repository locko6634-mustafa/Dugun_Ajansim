name: edge-proxy

services:
  socket-proxy:
    image: "ghcr.io/wollomatic/socket-proxy:1.13.0@sha256:0cca81832f3cc99df2b9eca6a25d133b2a2594ab9474bfdc1366fc38495daf97"
    platform: linux/amd64
    container_name: edge-proxy-socket-proxy
    restart: unless-stopped
    stop_grace_period: 10s
    user: "65534:${DOCKER_GID:?DOCKER_GID must be set}"
    cgroup: private
    privileged: false
    read_only: true
    cpus: 0.25
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 32
    environment:
      SP_LISTENIP: "0.0.0.0"
      SP_PROXYPORT: "2375"
      SP_ALLOWFROM: "traefik"
      SP_ALLOW_HEAD: "/_ping"
      SP_ALLOW_GET: '/v[0-9]+\.[0-9]+/(version|containers/json|containers/[0-9a-f]{64}/json|events)'
      SP_ALLOWHEALTHCHECK: "true"
      SP_WATCHDOGINTERVAL: "60"
      SP_STOPONWATCHDOG: "true"
      SP_SHUTDOWNGRACETIME: "5"
      SP_LOGLEVEL: "INFO"
      SP_LOGJSON: "true"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /healthcheck
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "false"
    networks:
      - socket_proxy

  traefik:
    image: "traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac"
    platform: linux/amd64
    container_name: edge-proxy-traefik
    restart: unless-stopped
    stop_grace_period: 30s
    user: "65532:65532"
    cgroup: private
    depends_on:
      socket-proxy:
        condition: service_healthy
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.queryparameters.defaultmode=drop"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=edge_proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.ping.address=127.0.0.1:8082"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--certificatesresolvers.mytlschallenge.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    networks:
      edge_proxy:
        ipv4_address: 172.30.0.2
        gw_priority: 1
      socket_proxy:
        gw_priority: 0
    volumes:
      - type: bind
        source: /opt/edge-proxy/letsencrypt
        target: /letsencrypt
        read_only: false
        bind:
          create_host_path: false
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping=true
        - --ping.entrypoint=ping
        - --entrypoints.ping.address=127.0.0.1:8082
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "false"

networks:
  edge_proxy:
    external: true
    name: edge_proxy
  socket_proxy:
    name: edge_socket_proxy
    driver: bridge
    internal: true
