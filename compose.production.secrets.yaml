name: dugun-ajansim

x-runtime-database-file-environment: &runtime-database-file-environment
  USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
  DATABASE_URL: !reset null
  DATABASE_URL_FILE: /run/secrets/database_url_runtime

x-runtime-database-secrets: &runtime-database-secrets
  - database_url_runtime

services:
  postgres:
    environment:
      USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_RUNTIME_PASSWORD: !reset null
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - postgres_owner_password
      - postgres_runtime_password
    volumes:
      - ./deploy/postgres/file-secrets.sh:/usr/local/bin/file-secrets.sh:ro
      - ./deploy/postgres/with-owner-password.sh:/usr/local/bin/with-owner-password.sh:ro

  migrate:
    environment:
      USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url_owner
    secrets:
      - database_url_owner

  seed:
    environment: *runtime-database-file-environment
    secrets: *runtime-database-secrets

  admin-bootstrap:
    environment: *runtime-database-file-environment
    secrets: *runtime-database-secrets

  db-role-bootstrap:
    environment:
      USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
      PGPASSWORD: !reset null
      PGPASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_RUNTIME_PASSWORD: !reset null
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - postgres_owner_password
      - postgres_runtime_password
    volumes:
      - ./deploy/postgres/file-secrets.sh:/usr/local/bin/file-secrets.sh:ro

  db-runtime-hardening:
    environment:
      USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
      PGPASSWORD: !reset null
      PGPASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    volumes:
      - ./deploy/postgres/file-secrets.sh:/usr/local/bin/file-secrets.sh:ro

  backup-crypto:
    environment:
      USE_FILE_SECRETS: ${USE_FILE_SECRETS:-0}
      BACKUP_ENCRYPTION_KEY: !reset null
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS: !reset null
      APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS_FILE: /run/secrets/application_key_fingerprints
    secrets:
      - backup_encryption_key
      - application_key_fingerprints

  pii-maintenance:
    environment:
      <<: *runtime-database-file-environment
      DATA_ENCRYPTION_KEY: !reset null
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      DATA_ENCRYPTION_KEYRING_JSON: !reset null
      DATA_ENCRYPTION_KEYRING_JSON_FILE: /run/secrets/data_encryption_keyring
      PII_BLIND_INDEX_KEY: !reset null
      PII_BLIND_INDEX_KEY_FILE: /run/secrets/pii_blind_index_key
    secrets:
      - database_url_runtime
      - data_encryption_key
      - data_encryption_keyring
      - pii_blind_index_key

  data-retention:
    environment: *runtime-database-file-environment
    secrets: *runtime-database-secrets

  backend:
    environment:
      <<: *runtime-database-file-environment
      TURNSTILE_SITE_KEY: !reset null
      TURNSTILE_SITE_KEY_FILE: /run/secrets/turnstile_site_key
      TURNSTILE_SECRET_KEY: !reset null
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret_key
      DATA_ENCRYPTION_KEY: !reset null
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS: !reset null
      APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS_FILE: /run/secrets/application_key_fingerprints
      DATA_ENCRYPTION_KEYRING_JSON: !reset null
      DATA_ENCRYPTION_KEYRING_JSON_FILE: /run/secrets/data_encryption_keyring
      PII_BLIND_INDEX_KEY: !reset null
      PII_BLIND_INDEX_KEY_FILE: /run/secrets/pii_blind_index_key
      RATE_LIMIT_HMAC_KEY: !reset null
      RATE_LIMIT_HMAC_KEY_FILE: /run/secrets/rate_limit_hmac_key
    secrets:
      - database_url_runtime
      - turnstile_site_key
      - turnstile_secret_key
      - data_encryption_key
      - application_key_fingerprints
      - data_encryption_keyring
      - pii_blind_index_key
      - rate_limit_hmac_key

secrets:
  postgres_owner_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:?POSTGRES_PASSWORD_SECRET_FILE zorunludur}
  postgres_runtime_password:
    file: ${POSTGRES_RUNTIME_PASSWORD_SECRET_FILE:?POSTGRES_RUNTIME_PASSWORD_SECRET_FILE zorunludur}
  database_url_owner:
    file: ${DATABASE_URL_OWNER_SECRET_FILE:?DATABASE_URL_OWNER_SECRET_FILE zorunludur}
  database_url_runtime:
    file: ${DATABASE_URL_RUNTIME_SECRET_FILE:?DATABASE_URL_RUNTIME_SECRET_FILE zorunludur}
  turnstile_site_key:
    file: ${TURNSTILE_SITE_KEY_SECRET_FILE:?TURNSTILE_SITE_KEY_SECRET_FILE zorunludur}
  turnstile_secret_key:
    file: ${TURNSTILE_SECRET_KEY_SECRET_FILE:?TURNSTILE_SECRET_KEY_SECRET_FILE zorunludur}
  data_encryption_key:
    file: ${DATA_ENCRYPTION_KEY_SECRET_FILE:?DATA_ENCRYPTION_KEY_SECRET_FILE zorunludur}
  application_key_fingerprints:
    file: ${APPLICATION_KEY_FINGERPRINTS_SECRET_FILE:?APPLICATION_KEY_FINGERPRINTS_SECRET_FILE zorunludur}
  data_encryption_keyring:
    file: ${DATA_ENCRYPTION_KEYRING_SECRET_FILE:?DATA_ENCRYPTION_KEYRING_SECRET_FILE zorunludur}
  pii_blind_index_key:
    file: ${PII_BLIND_INDEX_KEY_SECRET_FILE:?PII_BLIND_INDEX_KEY_SECRET_FILE zorunludur}
  rate_limit_hmac_key:
    file: ${RATE_LIMIT_HMAC_KEY_SECRET_FILE:?RATE_LIMIT_HMAC_KEY_SECRET_FILE zorunludur}
  backup_encryption_key:
    file: ${BACKUP_ENCRYPTION_KEY_SECRET_FILE:?BACKUP_ENCRYPTION_KEY_SECRET_FILE zorunludur}
