name: Production health watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  watchdog:
    name: Verify and recover application containers
    environment: production
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PUBLIC_ORIGIN: https://dugunajansim.com
      PUBLIC_HEALTHCHECK_MODE: ${{ vars.PUBLIC_HEALTHCHECK_MODE || 'strict' }}
      BACKEND_REPLICAS: "2"
      WATCHDOG_RECOVERY_TIMEOUT_SECONDS: "90"
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
    steps:
      - name: Validate pinned SSH host identity
        shell: bash
        run: |
          if [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "SERVER_HOST_FINGERPRINT must be a non-empty SHA256 host-key fingerprint" >&2
            exit 1
          fi

      - name: Run bounded production watchdog
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ env.SERVER_HOST_FINGERPRINT }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 8m
          envs: PUBLIC_ORIGIN,PUBLIC_HEALTHCHECK_MODE,BACKEND_REPLICAS,WATCHDOG_RECOVERY_TIMEOUT_SECONDS
          script_stop: true
          script: |
            set -eu
            cd /opt/dugun-ajansim/app
            bash deploy/watchdog.sh
