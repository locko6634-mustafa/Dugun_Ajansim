name: Deploy to Self-Hosted Server

on:
  workflow_run:
    workflows:
      - Project quality
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    environment: production
    timeout-minutes: 55
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PUBLIC_ORIGIN: https://dugunajansim.com
      PUBLIC_HEALTHCHECK_MODE: ${{ vars.PUBLIC_HEALTHCHECK_MODE || 'strict' }}
      BACKUP_MIN_FREE_MIB: "1024"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_MAX_FILES: "30"
      LEGACY_PLAINTEXT_BACKUP_CLEANUP: ${{ vars.LEGACY_PLAINTEXT_BACKUP_CLEANUP || '0' }}
      USE_FILE_SECRETS: "1"
      BACKEND_REPLICAS: "2"
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
    steps:
      - name: Validate pinned SSH host identity
        shell: bash
        run: |
          if [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "SERVER_HOST_FINGERPRINT must be a non-empty SHA256 host-key fingerprint" >&2
            exit 1
          fi

      - name: Deploy the exact quality-checked revision
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ env.SERVER_HOST_FINGERPRINT }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 45m
          envs: DEPLOY_SHA,PUBLIC_ORIGIN,PUBLIC_HEALTHCHECK_MODE,BACKUP_MIN_FREE_MIB,BACKUP_RETENTION_DAYS,BACKUP_MAX_FILES,LEGACY_PLAINTEXT_BACKUP_CLEANUP,USE_FILE_SECRETS,BACKEND_REPLICAS
          script_stop: true
          script: |
            set -eu

            if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Invalid deploy SHA" >&2
              exit 1
            fi

            cd /opt/dugun-ajansim/app
            previous_sha="$(git rev-parse HEAD)"
            if ! printf '%s' "$previous_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Invalid previous SHA" >&2
              exit 1
            fi

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"

            remote_main_sha="$(git rev-parse origin/main)"
            if [ "$remote_main_sha" != "$DEPLOY_SHA" ]; then
              echo "Refusing to deploy a revision that is not the current origin/main" >&2
              exit 1
            fi

            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            worktree_status="$(git status --porcelain --untracked-files=all)"
            if [ -n "$worktree_status" ]; then
              echo "Refusing to deploy a dirty or untracked worktree" >&2
              printf '%s\n' "$worktree_status" >&2
              exit 1
            fi
            export PREVIOUS_SHA="$previous_sha"
            bash deploy/deploy-production.sh
