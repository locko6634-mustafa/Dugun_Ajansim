name: Deploy to Self-Hosted Server

on:
  workflow_run:
    workflows:
      - Project quality
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      PUBLIC_ORIGIN: https://dugun.n8n-mustafa.me
    steps:
      - name: Deploy the exact quality-checked revision
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_SHA,PUBLIC_ORIGIN
          script_stop: true
          script: |
            set -eu

            if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Invalid deploy SHA" >&2
              exit 1
            fi

            cd /opt/dugun-ajansim/app
            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"

            remote_main_sha="$(git rev-parse origin/main)"
            if [ "$remote_main_sha" != "$DEPLOY_SHA" ]; then
              echo "Refusing to deploy a revision that is not the current origin/main" >&2
              exit 1
            fi

            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            compose="docker compose --env-file .env.production -f compose.production.yaml"
            $compose config -q

            umask 077
            mkdir -p backups
            chmod 700 backups
            backup_path="backups/pre-deploy-${DEPLOY_SHA}-$(date -u +%Y%m%dT%H%M%SZ).dump"
            $compose exec -T postgres sh -c \
              'PGPASSWORD="$POSTGRES_PASSWORD" exec pg_dump --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --format=custom --no-owner --no-acl' \
              > "$backup_path"
            test -s "$backup_path"
            $compose exec -T postgres pg_restore --list < "$backup_path" >/dev/null
            printf 'VALIDATED_BACKUP=%s\n' "$backup_path"

            $compose up -d --build --wait

            $compose exec -T backend node -e \
              "fetch('http://127.0.0.1:5000/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
            $compose exec -T frontend sh -c \
              "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
              "$PUBLIC_ORIGIN/healthz" | grep -qx ok
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
              "$PUBLIC_ORIGIN/api/v1/health" >/dev/null

            deployed_sha="$(git rev-parse HEAD)"
            test "$deployed_sha" = "$DEPLOY_SHA"
            printf 'DEPLOYED_GIT_SHA=%s\n' "$deployed_sha"
