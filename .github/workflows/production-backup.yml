name: Production encrypted backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  backup:
    name: Validate and retain encrypted backup
    environment: production
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      BACKUP_MIN_FREE_MIB: "1024"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_MAX_FILES: "30"
      LEGACY_PLAINTEXT_BACKUP_CLEANUP: ${{ vars.LEGACY_PLAINTEXT_BACKUP_CLEANUP || '0' }}
      USE_FILE_SECRETS: "1"
      BACKEND_REPLICAS: "2"
      SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
    steps:
      - name: Validate pinned SSH host identity
        shell: bash
        run: |
          if [[ ! "$SERVER_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "SERVER_HOST_FINGERPRINT must be a non-empty SHA256 host-key fingerprint" >&2
            exit 1
          fi

      - name: Create and restore-test encrypted production backup
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ env.SERVER_HOST_FINGERPRINT }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 35m
          envs: BACKUP_MIN_FREE_MIB,BACKUP_RETENTION_DAYS,BACKUP_MAX_FILES,LEGACY_PLAINTEXT_BACKUP_CLEANUP,USE_FILE_SECRETS,BACKEND_REPLICAS
          script_stop: true
          script: |
            set -eu
            cd /opt/dugun-ajansim/app
            export DEPLOY_SHA="$(git rev-parse HEAD)"
            bash deploy/deploy-production.sh --backup-only
