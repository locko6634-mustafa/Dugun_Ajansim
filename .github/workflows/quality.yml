name: Project quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run validate
      - run: npm run audit:performance
      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:e2e

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dugun_ajansim_test
        ports:
          - 55632:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d dugun_ajansim_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 5001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://test_user:test_password@localhost:55632/dugun_ajansim_test
      TEST_DATABASE_GUARD: dugun_ajansim_local_test_only
      TRUST_PROXY: 0
      HEALTHCHECK_TIMEOUT_MS: 3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - name: Install synthetic least-privilege runtime role
        env:
          PGHOST: localhost
          PGPORT: "55632"
          PGPASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: dugun_ajansim_test
          POSTGRES_RUNTIME_USER: ci_runtime
          POSTGRES_RUNTIME_PASSWORD: Ci-Runtime-Only-2026_
        run: sh ../deploy/postgres/init-runtime-role.sh
      - name: Verify runtime role privileges on PostgreSQL
        env:
          RUNTIME_DATABASE_URL: postgresql://ci_runtime:Ci-Runtime-Only-2026_@localhost:55632/dugun_ajansim_test
          RUNTIME_DATABASE_ROLE: ci_runtime
        run: npm run test:runtime-role
