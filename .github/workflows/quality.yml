name: Project quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run validate
      - run: npm run audit:performance
      - name: Playwright tarayıcı önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run test:e2e

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dugun_ajansim_test
        ports:
          - 55632:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d dugun_ajansim_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 5001
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://test_user:test_password@localhost:55632/dugun_ajansim_test
      TEST_DATABASE_GUARD: dugun_ajansim_local_test_only
      TRUST_PROXY: 0
      HEALTHCHECK_TIMEOUT_MS: 3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:integration
      - name: Install synthetic least-privilege runtime role
        env:
          PGHOST: localhost
          PGPORT: "55632"
          PGPASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: dugun_ajansim_test
          POSTGRES_RUNTIME_USER: ci_runtime
          POSTGRES_RUNTIME_PASSWORD: Ci-Runtime-Only-2026_
        run: sh ../deploy/postgres/init-runtime-role.sh
      - name: Verify runtime role privileges on PostgreSQL
        env:
          RUNTIME_DATABASE_URL: postgresql://ci_runtime:Ci-Runtime-Only-2026_@localhost:55632/dugun_ajansim_test
          RUNTIME_DATABASE_ROLE: ci_runtime
        run: npm run test:runtime-role

  phase06-release-gate:
    # TEMPORARY: Deploy after quality and backend-integration without running Phase06.
    # Remove this condition to restore the release gate.
    if: ${{ false }}
    needs: [quality, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Frontend test dependencies
        run: npm ci
      - name: Backend test dependencies
        working-directory: backend
        run: npm ci
      - name: Resolve Playwright version
        id: phase06-playwright-version
        shell: bash
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      - name: Phase06 Playwright browser cache
        id: phase06-playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: phase06-playwright-${{ runner.os }}-${{ steps.phase06-playwright-version.outputs.version }}
      - name: Release browser system dependencies
        run: npx playwright install-deps chromium webkit firefox
      - name: Release browser matrix
        if: steps.phase06-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit firefox
      - name: Phase06 BuildKit builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Phase06 build · PostgreSQL
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deploy/postgres/Dockerfile
          load: true
          tags: dugun-ajansim-phase06-postgres:${{ github.sha }}
          cache-from: type=gha,scope=phase06-postgres
          cache-to: type=gha,mode=max,scope=phase06-postgres
      - name: Phase06 build · migrate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: backend/Dockerfile
          target: migrate
          load: true
          tags: dugun-ajansim-phase06-migrate:${{ github.sha }}
          cache-from: type=gha,scope=phase06-migrate
          cache-to: type=gha,mode=max,scope=phase06-migrate
      - name: Phase06 build · backend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          build-args: BUILD_REVISION=${{ github.sha }}
          load: true
          tags: dugun-ajansim-phase06-backend:${{ github.sha }}
          cache-from: type=gha,scope=phase06-backend
          cache-to: type=gha,mode=max,scope=phase06-backend
      - name: Phase06 build · frontend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP_ORIGIN=https://quality.invalid
            BUILD_REVISION=${{ github.sha }}
          load: true
          tags: dugun-ajansim-phase06-frontend:${{ github.sha }}
          cache-from: type=gha,scope=phase06-frontend
          cache-to: type=gha,mode=max,scope=phase06-frontend
      - name: Phase06 boot
        id: phase06-boot
        shell: pwsh
        run: ./tools/run-phase06-quality.ps1 -Phase boot
      - name: Phase06 test
        shell: pwsh
        run: ./tools/run-phase06-quality.ps1 -Phase test -SkipChannels
      - name: Phase06 cleanup
        if: always() && steps.phase06-boot.outcome != 'skipped'
        shell: pwsh
        run: ./tools/run-phase06-quality.ps1 -Phase cleanup
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase06-${{ github.sha }}
          path: test-results/phase06
          if-no-files-found: ignore
          retention-days: 7
