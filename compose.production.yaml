name: dugun-ajansim

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 200
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dugun_ajansim}
      POSTGRES_USER: ${POSTGRES_USER:-dugun_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-dugun_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD zorunludur}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dugun_app} -d ${POSTGRES_DB:-dugun_ajansim}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  migrate:
    image: dugun-ajansim-migrate
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dugun_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  seed:
    image: dugun-ajansim-migrate
    command: ["npm", "run", "seed"]
    profiles:
      - bootstrap
    environment:
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD zorunludur}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  admin-bootstrap:
    image: dugun-ajansim-migrate
    command: ["node", "dist/scripts/bootstrapAdmin.js"]
    profiles:
      - admin-bootstrap
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD zorunludur}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY zorunludur}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dugunajansim_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REMEMBER_SESSION_TTL_DAYS: ${REMEMBER_SESSION_TTL_DAYS:-30}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-30}
      CUSTOMER_SESSION_IDLE_HOURS: ${CUSTOMER_SESSION_IDLE_HOURS:-12}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-72}
      PAYMENT_MODE: ${PAYMENT_MODE:-test}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-TEST BANKASI}
      PAYMENT_ACCOUNT_HOLDER: ${PAYMENT_ACCOUNT_HOLDER:-Düğün Ajansım Test Hesabı}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-TR000000000000000000000000}
      PAYMENT_WHATSAPP_PHONE: ${PAYMENT_WHATSAPP_PHONE:-905555555555}
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  db-role-bootstrap:
    image: postgres:17-alpine
    command: ["sh", "/usr/local/bin/init-runtime-role.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunludur}
      POSTGRES_DB: ${POSTGRES_DB:-dugun_ajansim}
      POSTGRES_USER: ${POSTGRES_USER:-dugun_app}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-dugun_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD zorunludur}
    volumes:
      - ./deploy/postgres/init-runtime-role.sh:/usr/local/bin/init-runtime-role.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD zorunludur}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY kesin Traefik IP adresi zorunludur}
      HEALTHCHECK_TIMEOUT_MS: 3000
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY zorunludur}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dugunajansim_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REMEMBER_SESSION_TTL_DAYS: ${REMEMBER_SESSION_TTL_DAYS:-30}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-30}
      CUSTOMER_SESSION_IDLE_HOURS: ${CUSTOMER_SESSION_IDLE_HOURS:-12}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-72}
      PAYMENT_MODE: ${PAYMENT_MODE:-test}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-TEST BANKASI}
      PAYMENT_ACCOUNT_HOLDER: ${PAYMENT_ACCOUNT_HOLDER:-Düğün Ajansım Test Hesabı}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-TR000000000000000000000000}
      PAYMENT_WHATSAPP_PHONE: ${PAYMENT_WHATSAPP_PHONE:-905555555555}
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge_proxy
      - traefik.http.routers.dugun-ajansim-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.dugun-ajansim-api.entrypoints=websecure
      - traefik.http.routers.dugun-ajansim-api.priority=100
      - traefik.http.routers.dugun-ajansim-api.tls=true
      - traefik.http.routers.dugun-ajansim-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.dugun-ajansim-api.middlewares=dugun-ajansim-compress
      - traefik.http.services.dugun-ajansim-api.loadbalancer.server.port=5000
      - traefik.http.middlewares.dugun-ajansim-compress.compress=true
    networks:
      - internal
      - edge_proxy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge_proxy
      - traefik.http.routers.dugun-ajansim.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.dugun-ajansim.entrypoints=websecure
      - traefik.http.routers.dugun-ajansim.priority=10
      - traefik.http.routers.dugun-ajansim.tls=true
      - traefik.http.routers.dugun-ajansim.tls.certresolver=mytlschallenge
      - traefik.http.routers.dugun-ajansim.middlewares=dugun-ajansim-compress,dugun-ajansim-security
      - traefik.http.services.dugun-ajansim.loadbalancer.server.port=8080
      - traefik.http.middlewares.dugun-ajansim-security.headers.contenttypenosniff=true
      - traefik.http.middlewares.dugun-ajansim-security.headers.customframeoptionsvalue=SAMEORIGIN
      - traefik.http.middlewares.dugun-ajansim-security.headers.permissionspolicy=camera=(), microphone=(), geolocation=()
      - traefik.http.middlewares.dugun-ajansim-security.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.dugun-ajansim-security.headers.stsincludesubdomains=true
      - traefik.http.middlewares.dugun-ajansim-security.headers.stsseconds=31536000
    networks:
      - edge_proxy

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  edge_proxy:
    external: true
