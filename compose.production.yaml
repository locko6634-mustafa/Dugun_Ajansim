name: dugun-ajansim

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: dugun-ajansim-postgres
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-512m}
    pids_limit: 300
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dugun_ajansim}
      POSTGRES_USER: ${POSTGRES_USER:-dugun_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-dugun_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3775
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dugun_app} -d ${POSTGRES_DB:-dugun_ajansim}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  migrate:
    image: dugun-ajansim-migrate
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dugun_app}:${POSTGRES_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${MIGRATE_CPU_LIMIT:-1.0}
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-1g}
    mem_reservation: ${MIGRATE_MEMORY_RESERVATION:-256m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging

  seed:
    image: dugun-ajansim-migrate
    command: ["node", "--import", "tsx", "prisma/seed.ts"]
    profiles:
      - bootstrap
    environment:
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
    depends_on:
      db-runtime-hardening:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${SEED_CPU_LIMIT:-0.75}
    mem_limit: ${SEED_MEMORY_LIMIT:-512m}
    mem_reservation: ${SEED_MEMORY_RESERVATION:-128m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging

  admin-bootstrap:
    image: dugun-ajansim-migrate
    command: ["node", "dist/scripts/bootstrapAdmin.js"]
    profiles:
      - admin-bootstrap
    environment:
      NODE_ENV: production
      APP_PROCESS_ROLE: admin-bootstrap
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY kesin Traefik IP adresi zorunludur}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-24}
    depends_on:
      db-runtime-hardening:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${ADMIN_BOOTSTRAP_CPU_LIMIT:-0.75}
    mem_limit: ${ADMIN_BOOTSTRAP_MEMORY_LIMIT:-512m}
    mem_reservation: ${ADMIN_BOOTSTRAP_MEMORY_RESERVATION:-128m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging

  db-role-bootstrap:
    image: dugun-ajansim-postgres
    command: ["sh", "/usr/local/bin/init-runtime-role.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dugun_ajansim}
      POSTGRES_USER: ${POSTGRES_USER:-dugun_app}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-dugun_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
    volumes:
      - ./deploy/postgres/init-runtime-role.sh:/usr/local/bin/init-runtime-role.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${DB_BOOTSTRAP_CPU_LIMIT:-0.50}
    mem_limit: ${DB_BOOTSTRAP_MEMORY_LIMIT:-256m}
    mem_reservation: ${DB_BOOTSTRAP_MEMORY_RESERVATION:-64m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    logging: *default-logging

  db-runtime-hardening:
    image: dugun-ajansim-postgres
    command: ["sh", "/usr/local/bin/configure-runtime-timeouts.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-dugun_ajansim}
      POSTGRES_USER: ${POSTGRES_USER:-dugun_app}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-dugun_runtime}
      POSTGRES_RUNTIME_STATEMENT_TIMEOUT_MS: ${POSTGRES_RUNTIME_STATEMENT_TIMEOUT_MS:-30000}
      POSTGRES_RUNTIME_LOCK_TIMEOUT_MS: ${POSTGRES_RUNTIME_LOCK_TIMEOUT_MS:-5000}
      POSTGRES_RUNTIME_IDLE_TRANSACTION_TIMEOUT_MS: ${POSTGRES_RUNTIME_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
    volumes:
      - ./deploy/postgres/configure-runtime-timeouts.sh:/usr/local/bin/configure-runtime-timeouts.sh:ro
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${DB_HARDENING_CPU_LIMIT:-0.50}
    mem_limit: ${DB_HARDENING_MEMORY_LIMIT:-256m}
    mem_reservation: ${DB_HARDENING_MEMORY_RESERVATION:-64m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    logging: *default-logging

  backup-crypto:
    image: dugun-ajansim-backup-crypto
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backup-crypto
    command: ["validate"]
    profiles:
      - operations
    environment:
      BACKUP_ENCRYPTION_ACTIVE_KEY_ID: ${BACKUP_ENCRYPTION_ACTIVE_KEY_ID:?BACKUP_ENCRYPTION_ACTIVE_KEY_ID zorunludur}
      BACKUP_ENCRYPTION_KEYRING_JSON: ${BACKUP_ENCRYPTION_KEYRING_JSON:-}
      APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS: ${APPLICATION_DATA_ENCRYPTION_KEY_FINGERPRINTS:-}
    network_mode: none
    restart: "no"
    stop_grace_period: 5s
    init: true
    read_only: true
    cpus: ${BACKUP_CRYPTO_CPU_LIMIT:-0.75}
    mem_limit: ${BACKUP_CRYPTO_MEMORY_LIMIT:-512m}
    mem_reservation: ${BACKUP_CRYPTO_MEMORY_RESERVATION:-128m}
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  pii-maintenance:
    image: dugun-ajansim-migrate
    command: ["node", "dist/scripts/maintainPiiEncryption.js", "--verify"]
    profiles:
      - operations
    environment:
      NODE_ENV: production
      APP_PROCESS_ROLE: pii-maintenance
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY kesin Traefik IP adresi zorunludur}
      DATA_ENCRYPTION_ACTIVE_KEY_ID: ${DATA_ENCRYPTION_ACTIVE_KEY_ID:?DATA_ENCRYPTION_ACTIVE_KEY_ID zorunludur}
      DATA_ENCRYPTION_KEYRING_JSON: ${DATA_ENCRYPTION_KEYRING_JSON:-}
      PII_BLIND_INDEX_ACTIVE_KEY_ID: ${PII_BLIND_INDEX_ACTIVE_KEY_ID:-legacy}
      PII_BLIND_INDEX_KEYRING_JSON: ${PII_BLIND_INDEX_KEYRING_JSON:-}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:-}
    depends_on:
      db-runtime-hardening:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${PII_MAINTENANCE_CPU_LIMIT:-0.75}
    mem_limit: ${PII_MAINTENANCE_MEMORY_LIMIT:-512m}
    mem_reservation: ${PII_MAINTENANCE_MEMORY_RESERVATION:-128m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging

  data-retention:
    image: dugun-ajansim-migrate
    command: ["node", "dist/scripts/maintainDataRetention.js"]
    profiles:
      - operations
    environment:
      NODE_ENV: production
      APP_PROCESS_ROLE: data-retention
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY kesin Traefik IP adresi zorunludur}
      PUBLIC_APPLICATION_RETENTION_DAYS: ${PUBLIC_APPLICATION_RETENTION_DAYS:-90}
      ARCHIVED_APPLICATION_RETENTION_DAYS: ${ARCHIVED_APPLICATION_RETENTION_DAYS:-365}
      ARCHIVED_WEDDING_RETENTION_DAYS: ${ARCHIVED_WEDDING_RETENTION_DAYS:-3650}
      SECURITY_ARTIFACT_RETENTION_DAYS: ${SECURITY_ARTIFACT_RETENTION_DAYS:-30}
      DATA_RETENTION_BATCH_SIZE: ${DATA_RETENTION_BATCH_SIZE:-100}
      DATA_RETENTION_MAX_BATCHES: ${DATA_RETENTION_MAX_BATCHES:-1000}
    depends_on:
      db-runtime-hardening:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${DATA_RETENTION_CPU_LIMIT:-0.50}
    mem_limit: ${DATA_RETENTION_MEMORY_LIMIT:-512m}
    mem_reservation: ${DATA_RETENTION_MEMORY_RESERVATION:-128m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        BUILD_REVISION: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    cpus: ${BACKEND_CPU_LIMIT:-1.50}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-256m}
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    logging: *default-logging
    environment:
      NODE_ENV: production
      APP_PROCESS_ROLE: api
      PORT: 5000
      CORS_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
      BOT_PROTECTION_MODE: ${BOT_PROTECTION_MODE:?BOT_PROTECTION_MODE zorunludur}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${APP_DOMAIN:?APP_DOMAIN zorunludur}
      TURNSTILE_VERIFY_TIMEOUT_MS: ${TURNSTILE_VERIFY_TIMEOUT_MS:-5000}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:-dugun_runtime}:${POSTGRES_RUNTIME_PASSWORD:-file-secret-required}@postgres:5432/${POSTGRES_DB:-dugun_ajansim}?sslmode=disable&connect_timeout=5&pool_timeout=10
      ALLOW_PRIVATE_DATABASE_WITHOUT_TLS: "true"
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY kesin Traefik IP adresi zorunludur}
      HEALTHCHECK_TIMEOUT_MS: 3000
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-15000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-10000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_ACTIVE_KEY_ID: ${DATA_ENCRYPTION_ACTIVE_KEY_ID:?DATA_ENCRYPTION_ACTIVE_KEY_ID zorunludur}
      DATA_ENCRYPTION_KEYRING_JSON: ${DATA_ENCRYPTION_KEYRING_JSON:-}
      PII_BLIND_INDEX_ACTIVE_KEY_ID: ${PII_BLIND_INDEX_ACTIVE_KEY_ID:-legacy}
      PII_BLIND_INDEX_KEYRING_JSON: ${PII_BLIND_INDEX_KEYRING_JSON:-}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY:-}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-}
      PII_ENCRYPTION_MODE: ${PII_ENCRYPTION_MODE:-strict}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dugunajansim_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-8}
      REMEMBER_SESSION_TTL_DAYS: ${REMEMBER_SESSION_TTL_DAYS:-30}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-240}
      SALON_SESSION_IDLE_MINUTES: ${SALON_SESSION_IDLE_MINUTES:-60}
      CUSTOMER_SESSION_IDLE_HOURS: ${CUSTOMER_SESSION_IDLE_HOURS:-12}
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-24}
      PAYMENT_MODE: ${PAYMENT_MODE:?PAYMENT_MODE zorunludur}
      PAYMENT_HANDOFF_TTL_MINUTES: ${PAYMENT_HANDOFF_TTL_MINUTES:-60}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:?PAYMENT_BANK_NAME zorunludur}
      PAYMENT_ACCOUNT_HOLDER: ${PAYMENT_ACCOUNT_HOLDER:?PAYMENT_ACCOUNT_HOLDER zorunludur}
      PAYMENT_IBAN: ${PAYMENT_IBAN:?PAYMENT_IBAN zorunludur}
      PAYMENT_WHATSAPP_PHONE: ${PAYMENT_WHATSAPP_PHONE:?PAYMENT_WHATSAPP_PHONE zorunludur}
    depends_on:
      db-runtime-hardening:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge_proxy
      - traefik.http.routers.dugun-ajansim-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.dugun-ajansim-api.entrypoints=websecure
      - traefik.http.routers.dugun-ajansim-api.priority=100
      - traefik.http.routers.dugun-ajansim-api.tls=true
      - traefik.http.routers.dugun-ajansim-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.dugun-ajansim-api.middlewares=dugun-ajansim-edge-ratelimit,dugun-ajansim-edge-inflight,dugun-ajansim-compress
      - traefik.http.services.dugun-ajansim-api.loadbalancer.server.port=5000
      - traefik.http.middlewares.dugun-ajansim-edge-ratelimit.ratelimit.average=${EDGE_RATE_LIMIT_AVERAGE:-20}
      - traefik.http.middlewares.dugun-ajansim-edge-ratelimit.ratelimit.period=${EDGE_RATE_LIMIT_PERIOD:-1s}
      - traefik.http.middlewares.dugun-ajansim-edge-ratelimit.ratelimit.burst=${EDGE_RATE_LIMIT_BURST:-40}
      - traefik.http.middlewares.dugun-ajansim-edge-ratelimit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=${EDGE_RATE_LIMIT_IPV6_SUBNET:-56}
      - traefik.http.middlewares.dugun-ajansim-edge-inflight.inflightreq.amount=${EDGE_INFLIGHT_REQUESTS:-50}
      - traefik.http.middlewares.dugun-ajansim-edge-inflight.inflightreq.sourcecriterion.requesthost=true
      - traefik.http.middlewares.dugun-ajansim-compress.compress=true
    networks:
      - internal
      - edge_proxy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN zorunludur}
        BUILD_REVISION: ${DEPLOY_SHA:-unknown}
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    read_only: true
    cpus: ${FRONTEND_CPU_LIMIT:-0.75}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-64m}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,size=8m,mode=1777
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge_proxy
      - traefik.http.routers.dugun-ajansim.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.dugun-ajansim.entrypoints=websecure
      - traefik.http.routers.dugun-ajansim.priority=10
      - traefik.http.routers.dugun-ajansim.tls=true
      - traefik.http.routers.dugun-ajansim.tls.certresolver=mytlschallenge
      - traefik.http.routers.dugun-ajansim.middlewares=dugun-ajansim-compress,dugun-ajansim-security
      - traefik.http.services.dugun-ajansim.loadbalancer.server.port=8080
      - traefik.http.middlewares.dugun-ajansim-security.headers.contenttypenosniff=true
      - traefik.http.middlewares.dugun-ajansim-security.headers.customframeoptionsvalue=SAMEORIGIN
      - traefik.http.middlewares.dugun-ajansim-security.headers.permissionspolicy=camera=(), microphone=(), geolocation=()
      - traefik.http.middlewares.dugun-ajansim-security.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.dugun-ajansim-security.headers.stsincludesubdomains=true
      - traefik.http.middlewares.dugun-ajansim-security.headers.stsseconds=31536000
    networks:
      - edge_proxy

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  edge_proxy:
    external: true
