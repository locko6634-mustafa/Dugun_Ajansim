services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dugun_ajansim_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_USER: test_user
    ports:
      - "127.0.0.1:55632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d dugun_ajansim_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
